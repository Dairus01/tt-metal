name: Build Alpine Test Image
on:
  push:
    branches: [llvc-fix-bounty]
    paths:
      - 'models/demos/audio/llvc/Dockerfile.alpine'
      - '.github/workflows/build-alpine-image.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: models/demos/audio/llvc/Dockerfile.alpine
          push: true
          tags: ghcr.io/dairus01/tt-metal-llvc:alpine-test
